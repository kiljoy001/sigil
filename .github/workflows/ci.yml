#
# CI for sigil.
#
# The corpus-cleanup work that this file was added for came out of a bug that
# took a session to find because results were not reproducible: a crash that
# appeared 8 times in 12 on one machine and looked like a race. The point of
# running these on every push is that a claim like "the tests pass" means the
# same thing tomorrow as it did today.
#
# What runs here and what does not:
#
#   * The C suite builds WITHOUT OpenVINO. GitHub runners have no Intel GPU
#     and no OpenVINO install, and libsigil falls back to the byte-shingle
#     embedder, which is exactly what the unit/property/OOM tests exercise.
#     The OpenVINO paths are covered by the local crash-rate harness
#     (test/crashrate.sh), which needs real hardware and stays manual.
#
#   * The Python pipeline tests run everywhere -- pure text processing over
#     fixtures committed to the repo, no corpus and no network.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build libsigil (no OpenVINO, no llama)
        run: make libsigil.a

      # differential/unit/bridge/oom. Not prop: theft is vendored in a
      # sibling libtab checkout that does not exist on a runner.
      - name: Unit, differential, bridge, allocation-failure tests
        run: make check

      - name: Sanitizer build and rerun
        run: |
          make clean
          make libsigil.a CFLAGS="-O1 -g -std=c11 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -fno-sanitize-recover=all"
          make check CFLAGS="-O1 -g -std=c11 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -fno-sanitize-recover=all"

  crap:
    # Complexity x coverage. High complexity is fine when covered, untested
    # code is fine when simple; CRAP flags the intersection, which is where
    # a bug survives review.
    #
    # A ratchet, not an audit: SIGIL_CRAP_ALLOW is 0, so any function that
    # crosses the threshold fails the build. Do not raise it to make a red
    # build green -- test the function or split it.
    #
    # It earned its place twice. It caught src/utf8_repair.c at 0% line
    # coverage and CRAP 600, because that code was tested only through
    # Python/ctypes and the C build never ran it. Then it caught the AVX2
    # filter kernels at 0%, which turned out not to be a testing gap at all
    # but an untestable design: the dispatcher runs exactly one kernel per
    # process, so the others were unreachable. sigil_simd_force() fixed
    # that, and coverage of scan_x86.c went 63% -> 88%.
    runs-on: ubuntu-24.04
    env:
      SIGIL_CRAP_MAX: 30
      SIGIL_CRAP_ALLOW: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lizard and gcovr
        run: pip install lizard gcovr

      - name: CRAP score
        run: sh test/crap.sh

      # Line coverage of our own C, excluding vendored BLAKE3 and the test
      # files themselves -- both inflate the number without saying anything
      # about whether sigil is tested. 90% is the floor, currently 91%.
      - name: C line coverage >= 90%
        run: |
          gcovr --root . --object-directory build/cov \
            --filter 'src/' --filter 'cmd/' --exclude 'third_party/' \
            --fail-under-line 90 --txt

  python-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest hypothesis pytest-cov

      # Property tests included: encoding repair is exactly the kind of code
      # where the case you did not think of is the one in the corpus.
      #
      # test_utf8_differential.py compiles src/utf8_repair.c and compares it
      # against the Python implementation over generated bytes. The repair
      # exists twice -- once offline in the pipeline, once as a guard in the
      # embedder -- and two copies of one mapping drift silently, because
      # both outputs are valid UTF-8 and neither crashes. The runner has cc,
      # so this belongs here rather than in the C job.
      # --cov-fail-under is the Python half of the CRAP ratchet. 50 is
      # below the current 55% because the uncovered remainder is main() --
      # argparse and the multiprocessing driver -- and pinning to the exact
      # number would fail on any refactor that moves a line. Raise it when
      # the CLI drivers get tests; do not lower it.
      - name: Pipeline and differential tests
        run: |
          python -m pytest tools/tests -v \
            --cov=clean --cov=boilerplate \
            --cov-report=term-missing --cov-fail-under=50

  mutation:
    # Mutation testing in two sets, because they answer different questions.
    #
    #   curated (test/mutate_py.sh) -- mistakes I chose: the ones a person
    #   could plausibly make in this specific code. Precise and reviewable,
    #   but bounded by what someone thought of.
    #
    #   generated (test/mutate_mutmut.sh) -- mutants nobody chose. Noisier
    #   and slower, but it reaches the corners no one was thinking about.
    #
    # The bug that prompted all of this -- invalid UTF-8 reaching PCRE2 --
    # was not on anyone's list, which is the argument for running both. On
    # its first working run the generated set found five real gaps the
    # curated set had missed, including a function the pool actually calls
    # that had no test at all.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest hypothesis mutmut

      # Curated set: every mutant must die. A survivor here means a
      # mistake we specifically anticipated is no longer detected.
      - name: Curated mutants (must be 0 survivors)
        run: PY=python sh test/mutate_py.sh

      # Generated set: a budget, not zero. ~95 survivors are in main() --
      # print intervals and argparse help text -- plus mutations that are
      # genuinely equivalent (Python codec names are case-insensitive, so
      # "ascii" -> "ASCII" is undetectable by construction). Lower the
      # number as survivors get fixed; raising it needs a reason.
      - name: Generated mutants (mutmut)
        env:
          MUTMUT_ALLOW: 135
        run: PY=python sh test/mutate_mutmut.sh
