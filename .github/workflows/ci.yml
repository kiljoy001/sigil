#
# CI for sigil.
#
# The corpus-cleanup work that this file was added for came out of a bug that
# took a session to find because results were not reproducible: a crash that
# appeared 8 times in 12 on one machine and looked like a race. The point of
# running these on every push is that a claim like "the tests pass" means the
# same thing tomorrow as it did today.
#
# What runs here and what does not:
#
#   * The C suite builds WITHOUT OpenVINO. GitHub runners have no Intel GPU
#     and no OpenVINO install, and libsigil falls back to the byte-shingle
#     embedder, which is exactly what the unit/property/OOM tests exercise.
#     The OpenVINO paths are covered by the local crash-rate harness
#     (test/crashrate.sh), which needs real hardware and stays manual.
#
#   * The Python pipeline tests run everywhere -- pure text processing over
#     fixtures committed to the repo, no corpus and no network.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build libsigil (no OpenVINO, no llama)
        run: make libsigil.a

      # differential/unit/bridge/oom. Not prop: theft is vendored in a
      # sibling libtab checkout that does not exist on a runner.
      - name: Unit, differential, bridge, allocation-failure tests
        run: make check

      - name: Sanitizer build and rerun
        run: |
          make clean
          make libsigil.a CFLAGS="-O1 -g -std=c11 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -fno-sanitize-recover=all"
          make check CFLAGS="-O1 -g -std=c11 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -fno-sanitize-recover=all"

  crap:
    # Complexity x coverage. High complexity is fine when covered, untested
    # code is fine when simple; CRAP flags the intersection, which is where
    # a bug survives review.
    #
    # This gate is a ratchet, not an audit. SIGIL_CRAP_ALLOW is the count
    # already over the line -- currently the two AVX2 filter kernels, which
    # the -O0 coverage build never dispatches to because the runtime
    # calibration picks another path there. New untested complexity fails
    # the build; clearing the existing two means lowering the number.
    #
    # It earned its place immediately: it caught src/utf8_repair.c at 0%
    # line coverage and CRAP 600, because that code was tested only through
    # Python/ctypes and the C build never executed it.
    runs-on: ubuntu-24.04
    env:
      SIGIL_CRAP_MAX: 30
      SIGIL_CRAP_ALLOW: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lizard and gcovr
        run: pip install lizard gcovr

      - name: CRAP score
        run: sh test/crap.sh

  python-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest hypothesis pytest-cov

      # Property tests included: encoding repair is exactly the kind of code
      # where the case you did not think of is the one in the corpus.
      #
      # test_utf8_differential.py compiles src/utf8_repair.c and compares it
      # against the Python implementation over generated bytes. The repair
      # exists twice -- once offline in the pipeline, once as a guard in the
      # embedder -- and two copies of one mapping drift silently, because
      # both outputs are valid UTF-8 and neither crashes. The runner has cc,
      # so this belongs here rather than in the C job.
      # --cov-fail-under is the Python half of the CRAP ratchet. 50 is
      # below the current 55% because the uncovered remainder is main() --
      # argparse and the multiprocessing driver -- and pinning to the exact
      # number would fail on any refactor that moves a line. Raise it when
      # the CLI drivers get tests; do not lower it.
      - name: Pipeline and differential tests
        run: |
          python -m pytest tools/tests -v \
            --cov=clean --cov=boilerplate \
            --cov-report=term-missing --cov-fail-under=50
